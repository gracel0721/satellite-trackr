name: Refresh orbital data

# Runs the pipeline on a schedule and commits the updated JSON back to the
# repo so the deployed demo always has fresh orbits/events. Can also be
# triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"  # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline/run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orbits/orbits.json data/events/events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh orbital data [skip ci]"
            git push
          fi
